<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- These defaults describe the index page. scripts/postbuild.mjs rewrites
         them per tool when it stamps out the prerendered route directories. -->
    <title>Developer Tools — Free, Private, In-Browser Utilities</title>
    <meta
      name="description"
      content="Free developer utilities that run entirely in your browser: JWT decoder, UUID generator, Base64, JSON formatter, QR codes and more. Nothing is uploaded."
    />
    <link rel="canonical" href="https://shashikanth077.github.io/tools/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shashikanth H R — Developer Tools" />
    <meta property="og:title" content="Developer Tools — Free, Private, In-Browser Utilities" />
    <meta
      property="og:description"
      content="Free developer utilities that run entirely in your browser. Nothing is uploaded."
    />
    <meta property="og:url" content="https://shashikanth077.github.io/tools/" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#0B6E4F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)" />

    <!-- Resolves the theme synchronously, before first paint, so the preboot
         loader below matches the user's saved preference instead of flashing
         the wrong palette for a frame. Mirrors useResolvedTheme() in
         shell-context.tsx — kept in sync by hand since that file can't run yet. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("devtools.theme");
          var dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <!-- Self-contained styling for the pre-JS loader only — it must render
         before the app's own stylesheet (bundled with the JS) has arrived. -->
    <style>
      #root:has(> .tn-preboot) { display: contents; }
      .tn-preboot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #fcfcfb;
        color: #4a5157;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="dark"] .tn-preboot {
        background: #101312;
        color: #a8b0ac;
      }
      .tn-preboot__mark { font-size: 2rem; line-height: 1; animation: tn-preboot-pulse 1.6s ease-in-out infinite; }
      .tn-preboot__ring {
        width: 2rem;
        height: 2rem;
        animation: tn-preboot-spin 0.8s linear infinite;
      }
      .tn-preboot__arc {
        stroke: #0b6e4f;
        stroke-dasharray: 80, 200;
      }
      :root[data-theme="dark"] .tn-preboot__arc { stroke: #4fbf8f; }
      .tn-preboot__label { font-size: 0.875rem; font-weight: 500; }
      @keyframes tn-preboot-spin { to { transform: rotate(360deg); } }
      @keyframes tn-preboot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="tn-preboot" role="status" aria-live="polite">
      <span class="tn-preboot__mark" aria-hidden="true">🧰</span>
      <svg class="tn-preboot__ring" viewBox="0 0 50 50" aria-hidden="true">
        <circle cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke="currentColor" opacity="0.25" />
        <circle class="tn-preboot__arc" cx="25" cy="25" r="20" fill="none" stroke-width="4" stroke-linecap="round" />
      </svg>
      <span class="tn-preboot__label">Loading ToolNest…</span>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
