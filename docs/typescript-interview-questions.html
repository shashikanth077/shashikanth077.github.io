<header><div class="wrap"><h1>TypeScript Interview Questions</h1><p>37 questions with explanations, runnable examples and a quiz. All code samples were compiled with TypeScript 5.9 in strict mode.</p></div></header>

</main><footer>Tip: click a question to reveal its answer. Progress is saved in your browser.</footer>
<script>
const DATA=[{"cat": "Basics", "lvl": "Beginner", "q": "What is TypeScript, and how is it different from JavaScript?", "short": "TypeScript is a typed superset of JavaScript that is checked at compile time and erased to plain JavaScript.", "why": ["Every valid JavaScript program is also valid TypeScript. TypeScript adds a <b>static type system<\/b> on top: the compiler (<code>tsc<\/code>) checks your code <i>before<\/i> it runs and then removes all the types, producing ordinary JavaScript.", "The types exist only at compile time. At runtime there is no TypeScript - the browser or Node just runs JavaScript. That is why TypeScript cannot validate data coming from an API by itself."], "code": "function add(a: number, b: number): number {\n  return a + b;\n}\nadd(1, 2);\nadd(\"1\", 2); // ❌ Argument of type 'string' is not assignable to 'number'", "pts": ["Superset of JavaScript", "Errors are caught at compile time, not runtime", "Types are erased - zero runtime cost", "Great editor tooling: autocomplete, refactoring, navigation"], "id": 1}, {"cat": "Basics", "lvl": "Beginner", "q": "What is the difference between any, unknown and never?", "short": "any switches type checking off, unknown is a safe 'anything' you must narrow first, never is the type of values that cannot exist.", "why": ["<b>any<\/b> opts out of checking: you can do anything with it, and it spreads silently through your code.", "<b>unknown<\/b> also accepts any value, but you cannot use it until you narrow it with a check. Prefer it for data whose shape you do not know (JSON, catch clauses).", "<b>never<\/b> is the empty type: a function that always throws, or a branch that is impossible. It is also the key to exhaustiveness checks."], "code": "let a: any = \"hi\";\na.toFixed(); // no error here - crashes at runtime\n\nlet u: unknown = \"hi\";\nu.toUpperCase(); // ❌ 'u' is of type 'unknown'\nif (typeof u === \"string\") {\n  u.toUpperCase(); // OK: narrowed to string\n}\n\nfunction fail(msg: string): never {\n  throw new Error(msg);\n}", "pts": ["any = no safety", "unknown = safe, must narrow", "never = no possible value", "Use unknown instead of any for untrusted input"], "id": 2}, {"cat": "Basics", "lvl": "Beginner", "q": "How does type inference work? When should you annotate explicitly?", "short": "TypeScript infers types from initial values and return statements; annotate function parameters and public APIs, let inference do the rest.", "why": ["The compiler works out types from context: a variable's initial value, a function's return expressions, or the position of a callback.", "Annotate <b>parameters<\/b> (they cannot be inferred), exported function return types (a stable contract), and empty values like <code>[]<\/code> or <code>{}<\/code> that would otherwise be too loose."], "code": "const n = 10;            // type is the literal 10 (const)\nlet s = \"hello\";         // type is string (let widens)\nconst xs = [1, 2, 3];    // number[]\n\nfunction double(x: number) {\n  return x * 2;          // return type inferred: number\n}\n\nconst items: string[] = []; // annotate empty array", "pts": ["const keeps literals, let widens", "Parameters need annotations", "Annotate exported APIs for stability", "Contextual typing infers callback parameters"], "id": 3}, {"cat": "Basics", "lvl": "Beginner", "q": "What are literal types and what does `as const` do?", "short": "A literal type is one exact value such as 'GET'; as const freezes an expression to its narrowest, readonly literal types.", "why": ["Without help, an object's properties widen: <code>{ method: 'GET' }<\/code> gives <code>method: string<\/code>. That breaks APIs expecting <code>'GET' | 'POST'<\/code>.", "<code>as const<\/code> tells TypeScript to infer the narrowest type and make everything <code>readonly<\/code>. It is perfect for config objects and for deriving unions from arrays."], "code": "type Method = \"GET\" | \"POST\";\nfunction request(m: Method) {}\n\nconst loose = { method: \"GET\" };\nrequest(loose.method); // ❌ string is not assignable to Method\n\nconst tight = { method: \"GET\" } as const;\nrequest(tight.method); // OK\n\nconst ROLES = [\"admin\", \"user\"] as const;\ntype Role = (typeof ROLES)[number]; // \"admin\" | \"user\"", "pts": ["Literal = exact value as a type", "as const = narrow + readonly", "Derive unions from arrays with typeof X[number]"], "id": 4}, {"cat": "Basics", "lvl": "Beginner", "q": "Arrays vs tuples - what's the difference?", "short": "An array is a variable-length list of one type; a tuple has a fixed length with a known type at each position.", "why": ["<code>number[]<\/code> means any number of numbers. A tuple such as <code>[string, number]<\/code> means exactly two items, string first and number second.", "Tuples can have optional and labelled elements, and they are what React's <code>useState<\/code> returns."], "code": "const nums: number[] = [1, 2, 3];\n\nconst pair: [string, number] = [\"age\", 30];\nconst [label, value] = pair;       // string, number\npair[2];                           // ❌ Tuple type of length 2 has no element at index 2\n\ntype Point = [x: number, y: number, z?: number];\nconst p: Point = [1, 2];", "pts": ["Array: any length, one type", "Tuple: fixed length, per-position types", "Labels improve readability"], "id": 5}, {"cat": "Basics", "lvl": "Beginner", "q": "enum vs union of string literals - which should you use?", "short": "Prefer a union of literals (or an as const object); enums emit runtime code and have quirks.", "why": ["Regular enums generate a real JavaScript object, and numeric enums allow reverse mapping and accept any number in older versions. String-literal unions generate nothing and are easier to tree-shake and to serialise.", "Use an enum only when you need a runtime object and are sure of the trade-offs. An <code>as const<\/code> object gives you a runtime value plus a derived union."], "code": "enum Direction { Up = \"UP\", Down = \"DOWN\" }   // emits JS code\n\ntype Dir = \"UP\" | \"DOWN\";                      // emits nothing\n\nconst Status = { Active: \"active\", Off: \"off\" } as const;\ntype Status = (typeof Status)[keyof typeof Status]; // \"active\" | \"off\"\n\nlet s: Status = \"active\";\ns = \"paused\"; // ❌ not assignable to Status", "pts": ["Unions are erased, enums are not", "as const object = value + type", "const enum has pitfalls with isolatedModules"], "id": 6}, {"cat": "Basics", "lvl": "Beginner", "q": "How do null, undefined, optional properties and optional chaining work with strictNullChecks?", "short": "With strictNullChecks on, null and undefined are separate types you must handle; ?. and ?? make that concise.", "why": ["With <code>strict<\/code> mode, <code>string<\/code> does not include <code>null<\/code> or <code>undefined<\/code>. You must write <code>string | null<\/code> and check before use.", "<code>?.<\/code> stops at null/undefined and returns undefined. <code>??<\/code> supplies a default only for null/undefined (unlike <code>||<\/code>, which also replaces 0 and an empty string). The <code>!<\/code> non-null assertion silences the compiler and is unchecked - use sparingly."], "code": "interface User { name: string; address?: { city: string } }\n\nfunction city(u: User) {\n  return u.address.city;         // ❌ 'u.address' is possibly 'undefined'\n}\n\nfunction safe(u: User) {\n  return u.address?.city ?? \"Unknown\";\n}\n\nconst count = 0;\nconst a = count || 10;  // 10  (0 is falsy)\nconst b = count ?? 10;  // 0", "pts": ["Turn on strict", "?. short-circuits", "?? only replaces null/undefined", "Avoid ! unless you can prove it"], "id": 7}, {"cat": "Basics", "lvl": "Beginner", "q": "What are void and never as return types?", "short": "void means 'returns nothing useful'; never means 'never returns at all'.", "why": ["A function that finishes without returning a value is <code>void<\/code>. A function that always throws or loops forever is <code>never<\/code> - the caller's code after it is unreachable.", "A subtle point: a callback typed <code>() =&gt; void<\/code> may still return a value; the result is just ignored."], "code": "function log(msg: string): void {\n  console.log(msg);\n}\n\nfunction crash(msg: string): never {\n  throw new Error(msg);\n}\n\nconst cb: () => void = () => 42; // allowed, the 42 is ignored\n[1, 2].forEach((n) => n * 2);", "pts": ["void: completes normally", "never: does not complete", "() => void callbacks can return values"], "id": 8}, {"cat": "Types", "lvl": "Beginner", "q": "interface vs type alias - what's the difference?", "short": "Both describe object shapes; interfaces can be merged and extended, type aliases can name any type including unions.", "why": ["<b>interface<\/b> supports declaration merging (two interfaces with the same name combine) and <code>extends<\/code>. It is also slightly better for error messages and caching in huge codebases.", "<b>type<\/b> can alias primitives, unions, tuples, mapped and conditional types - things an interface cannot express.", "Practical rule: use <code>interface<\/code> for public object shapes and class contracts, <code>type<\/code> for everything else; be consistent within a codebase."], "code": "interface Animal { name: string }\ninterface Animal { legs: number }          // merges with the one above\nconst a: Animal = { name: \"Cat\", legs: 4 };\n\ntype ID = string | number;                  // interface can't do this\ntype Pair = [string, number];\n\ninterface Dog extends Animal { bark(): void }\ntype Cat = Animal & { purr(): void };       // intersection", "pts": ["interface merges, type does not", "type can alias unions/tuples/primitives", "Both can be implemented by classes if object-shaped"], "id": 9}, {"cat": "Types", "lvl": "Beginner", "q": "Explain union and intersection types.", "short": "A | B is 'either', A & B is 'both at once'.", "why": ["A <b>union<\/b> value is one of several types; you can only use members common to all until you narrow it.", "An <b>intersection<\/b> merges types, so the value must satisfy all of them. It is commonly used to combine object shapes."], "code": "type Id = string | number;\nfunction show(id: Id) {\n  id.toUpperCase(); // ❌ Property 'toUpperCase' does not exist on type 'number'\n  if (typeof id === \"string\") id.toUpperCase();\n}\n\ntype Named = { name: string };\ntype Aged = { age: number };\ntype Person = Named & Aged;\nconst p: Person = { name: \"Asha\", age: 30 };", "pts": ["Union = OR, narrow before use", "Intersection = AND, combine shapes", "Intersecting incompatible primitives gives never"], "id": 10}, {"cat": "Types", "lvl": "Intermediate", "q": "What are type assertions? How is `satisfies` different?", "short": "An assertion (as T) overrides the compiler without checking; satisfies checks a value against a type while keeping its precise inferred type.", "why": ["<code>as<\/code> tells the compiler 'trust me'. It does not convert anything at runtime and can hide bugs. <code>satisfies<\/code> (TS 4.9+) validates that a value conforms to a type but does <i>not<\/i> widen it, so you keep autocomplete on specific keys.", "Prefer <code>satisfies<\/code> or a type guard over <code>as<\/code> whenever you can."], "code": "type Colors = Record<string, string | number[]>;\n\nconst palette = {\n  red: [255, 0, 0],\n  green: \"#00ff00\",\n} satisfies Colors;\n\npalette.red.map((n) => n * 2);      // still known to be number[]\npalette.green.toUpperCase();        // still known to be string\n\nconst input = document.getElementById(\"x\") as HTMLInputElement;\nconst bad = \"hello\" as number;      // ❌ Conversion of type 'string' to 'number' may be a mistake", "pts": ["as = override, no runtime effect", "satisfies = validate, keep narrow type", "Double assertion (as unknown as T) is a red flag"], "id": 11}, {"cat": "Types", "lvl": "Beginner", "q": "What does readonly do, and how is it different from const?", "short": "const prevents reassigning a variable; readonly prevents changing a property or array element - both are compile-time only.", "why": ["<code>const<\/code> locks the binding. <code>readonly<\/code> locks a property, an array (<code>readonly string[]<\/code>) or a tuple. Neither freezes the value at runtime - use <code>Object.freeze<\/code> for that.", "<code>Readonly&lt;T&gt;<\/code> applies the modifier to every property (shallowly)."], "code": "interface Config { readonly url: string }\nconst c: Config = { url: \"a\" };\nc.url = \"b\";                     // ❌ Cannot assign to 'url' (read-only)\n\nconst list: readonly number[] = [1, 2];\nlist.push(3);                    // ❌ Property 'push' does not exist on 'readonly number[]'\n\nconst user = { name: \"A\" };\nuser.name = \"B\";                 // allowed: const only locks the variable", "pts": ["const = binding, readonly = property", "Shallow only", "Compile-time only"], "id": 12}, {"cat": "Types", "lvl": "Intermediate", "q": "What are index signatures and Record<K, V>?", "short": "Both describe objects with dynamic keys; Record<K, V> is the shorthand and also allows a fixed set of keys.", "why": ["An <b>index signature<\/b> says 'any string key maps to this type'. <code>Record&lt;'a' | 'b', number&gt;<\/code> requires exactly those keys.", "With <code>noUncheckedIndexedAccess<\/code>, reading a dynamic key returns <code>V | undefined<\/code>, which is more honest."], "code": "interface Dict { [key: string]: number }\nconst scores: Dict = { alice: 90 };\nscores.bob = 70;\n\ntype Level = \"low\" | \"high\";\nconst limits: Record<Level, number> = { low: 1, high: 10 };\nconst bad: Record<Level, number> = { low: 1 }; // ❌ Property 'high' is missing", "pts": ["Index signature = open-ended keys", "Record with a union = exact required keys", "Enable noUncheckedIndexedAccess for safer reads"], "id": 13}, {"cat": "Functions", "lvl": "Intermediate", "q": "How do you type functions, optional/default/rest parameters and overloads?", "short": "Annotate parameters and return type; use ?, defaults and ...rest as in JS; use overloads when the return type depends on the arguments.", "why": ["Optional parameters must come after required ones. Overloads are several signatures followed by one implementation signature that is not visible to callers.", "Often a generic or a union return is simpler than overloads."], "code": "function greet(name: string, greeting = \"Hello\", ...extra: string[]): string {\n  return `${greeting}, ${name}` + extra.join(\"\");\n}\n\nfunction parse(x: string): number;\nfunction parse(x: string[]): number[];\nfunction parse(x: string | string[]) {\n  return Array.isArray(x) ? x.map(Number) : Number(x);\n}\nconst one = parse(\"1\");     // number\nconst many = parse([\"1\"]);  // number[]\nparse(1);                   // ❌ No overload matches this call", "pts": ["Optional params after required", "Overload implementation signature is hidden", "Consider generics before overloads"], "id": 14}, {"cat": "Functions", "lvl": "Intermediate", "q": "What is structural typing and what are excess property checks?", "short": "TypeScript compares shapes, not names; but fresh object literals are checked strictly for extra properties.", "why": ["If an object has at least the required properties it is compatible, regardless of what it is called ('duck typing').", "The exception is an object <i>literal<\/i> assigned directly: unknown extra keys are flagged because they are probably typos. Assign via a variable and the check disappears."], "code": "interface Point { x: number; y: number }\nconst p3 = { x: 1, y: 2, z: 3 };\nconst ok: Point = p3;                       // OK: not a fresh literal\nconst bad: Point = { x: 1, y: 2, z: 3 };    // ❌ 'z' does not exist in type 'Point'", "pts": ["Shape matters, not name", "Excess property check is for fresh literals only", "Not the same as runtime validation"], "id": 15}, {"cat": "Narrowing", "lvl": "Intermediate", "q": "What is type narrowing? List the main techniques.", "short": "Narrowing refines a wide type to a more specific one inside a branch, using typeof, instanceof, in, equality, truthiness and user-defined guards.", "why": ["The compiler tracks control flow: after <code>if (typeof x === 'string')<\/code>, <code>x<\/code> is a string in that block.", "Custom guards use a <b>type predicate<\/b> <code>x is T<\/code>: you return a boolean and TypeScript trusts you, so make the check correct."], "code": "function f(x: string | number | Date | null) {\n  if (x === null) return;\n  if (typeof x === \"string\") return x.length;\n  if (x instanceof Date) return x.getTime();\n  return x.toFixed(2);                 // number\n}\n\ninterface Cat { meow(): void }\ninterface Dog { bark(): void }\nfunction isCat(a: Cat | Dog): a is Cat {\n  return \"meow\" in a;\n}", "pts": ["typeof, instanceof, in, ===, truthiness", "User-defined guards: x is T", "Control-flow analysis does the rest"], "id": 16}, {"cat": "Narrowing", "lvl": "Intermediate", "q": "What are discriminated unions and how do exhaustiveness checks work?", "short": "A union whose members share a literal 'tag' property; a switch on the tag narrows each case, and never catches missing cases.", "why": ["Give each variant a unique literal field such as <code>kind<\/code>. Inside <code>case 'circle'<\/code> TypeScript knows exactly which shape you have.", "In <code>default<\/code>, assign the value to <code>never<\/code>. If you add a new variant and forget a case, the compiler errors right there."], "code": "type Shape =\n  | { kind: \"circle\"; r: number }\n  | { kind: \"square\"; side: number };\n\nfunction area(s: Shape): number {\n  switch (s.kind) {\n    case \"circle\": return Math.PI * s.r ** 2;\n    case \"square\": return s.side ** 2;\n    default: {\n      const _never: never = s;  // errors if a case is missing\n      return _never;\n    }\n  }\n}", "pts": ["Shared literal tag", "Switch narrows per case", "Assign to never for exhaustiveness"], "id": 17}, {"cat": "Narrowing", "lvl": "Advanced", "q": "What are assertion functions?", "short": "A function with 'asserts x is T' that throws if the condition fails, narrowing the variable for the code after the call.", "why": ["Useful for validation helpers: after the call returns, the compiler treats the value as the asserted type. The function must actually throw otherwise, because TypeScript trusts the signature."], "code": "function assertString(v: unknown): asserts v is string {\n  if (typeof v !== \"string\") throw new Error(\"Not a string\");\n}\n\nfunction run(input: unknown) {\n  assertString(input);\n  return input.toUpperCase();   // input is string here\n}", "pts": ["asserts x is T", "Must throw on failure", "Narrows code after the call"], "id": 18}, {"cat": "Generics", "lvl": "Intermediate", "q": "What are generics and why use them?", "short": "Generics let you write reusable code that keeps the relationship between input and output types instead of falling back to any.", "why": ["A type parameter is a placeholder filled in at the call site (or inferred). Constraints with <code>extends<\/code> limit what can be passed. Defaults make the parameter optional."], "code": "function first<T>(xs: T[]): T | undefined {\n  return xs[0];\n}\nconst n = first([1, 2, 3]);       // number | undefined\nconst s = first([\"a\", \"b\"]);      // string | undefined\n\nfunction longest<T extends { length: number }>(a: T, b: T): T {\n  return a.length >= b.length ? a : b;\n}\nlongest(\"abc\", \"de\");\nlongest(1, 2);                    // ❌ number has no 'length'\n\ninterface Box<T = string> { value: T }", "pts": ["Type parameters preserve relationships", "extends adds constraints", "Defaults: <T = string>"], "id": 19}, {"cat": "Generics", "lvl": "Intermediate", "q": "Explain keyof, typeof and indexed access types.", "short": "keyof gives a union of an object's keys, typeof (in a type position) gets a value's type, T[K] looks up a property's type.", "why": ["Together they let you derive types from existing values instead of duplicating them. The classic <code>getProp<\/code> function uses <code>K extends keyof T<\/code> to make property access fully type-safe."], "code": "const user = { id: 1, name: \"Asha\" };\ntype User = typeof user;            // { id: number; name: string }\ntype UserKey = keyof User;          // \"id\" | \"name\"\ntype NameType = User[\"name\"];       // string\n\nfunction getProp<T, K extends keyof T>(obj: T, key: K): T[K] {\n  return obj[key];\n}\ngetProp(user, \"name\");              // string\ngetProp(user, \"email\");             // ❌ not assignable to \"id\" | \"name\"", "pts": ["keyof T = union of keys", "typeof value = its type", "T[K] = indexed access"], "id": 20}, {"cat": "Utility Types", "lvl": "Intermediate", "q": "Name and explain the most useful built-in utility types.", "short": "Partial, Required, Readonly, Pick, Omit, Record, Exclude, Extract, NonNullable, ReturnType, Parameters, Awaited.", "why": ["They are all written with mapped/conditional types in the standard library. Learning them removes a lot of duplicated interfaces."], "code": "interface User { id: number; name: string; email?: string }\n\ntype Draft   = Partial<User>;                 // all optional\ntype Full    = Required<User>;                // all required\ntype Preview = Pick<User, \"id\" | \"name\">;\ntype NoId    = Omit<User, \"id\">;\n\ntype A = Exclude<\"a\" | \"b\" | \"c\", \"a\">;       // \"b\" | \"c\"\ntype B = NonNullable<string | null>;          // string\n\nfunction make() { return { ok: true }; }\ntype R = ReturnType<typeof make>;             // { ok: boolean }\ntype P = Parameters<(a: string, b: number) => void>; // [string, number]\ntype D = Awaited<Promise<string>>;            // string", "pts": ["Partial/Required/Readonly change modifiers", "Pick/Omit select properties", "Exclude/Extract filter unions", "ReturnType/Parameters read function types"], "id": 21}, {"cat": "Utility Types", "lvl": "Advanced", "q": "What are mapped types? Write your own Mutable<T> and getters.", "short": "A mapped type loops over keys: { [K in keyof T]: ... }, optionally changing modifiers or renaming keys with 'as'.", "why": ["Add or remove modifiers with <code>+/-readonly<\/code> and <code>+/-?<\/code>. Key remapping with <code>as<\/code> lets you rename or filter keys."], "code": "type Mutable<T> = { -readonly [K in keyof T]: T[K] };\n\ntype Getters<T> = {\n  [K in keyof T as `get${Capitalize<string & K>}`]: () => T[K];\n};\n\ninterface P { name: string; age: number }\ntype PG = Getters<P>;\n// { getName: () => string; getAge: () => number }\n\ntype OnlyStrings<T> = {\n  [K in keyof T as T[K] extends string ? K : never]: T[K];\n};", "pts": ["[K in keyof T] iterates keys", "-readonly / -? remove modifiers", "as clause renames or filters"], "id": 22}, {"cat": "Utility Types", "lvl": "Advanced", "q": "What are conditional types and the infer keyword?", "short": "T extends U ? X : Y picks a type based on a relation, and infer captures part of a matched type.", "why": ["Conditional types distribute over unions when the checked type is a naked type parameter. <code>infer<\/code> declares a new type variable inside the <code>extends<\/code> clause, which is how <code>ReturnType<\/code> is built."], "code": "type IsString<T> = T extends string ? true : false;\ntype X = IsString<\"a\">;            // true\ntype Y = IsString<1 | \"a\">;        // boolean (distributes)\n\ntype MyReturn<T> = T extends (...args: any[]) => infer R ? R : never;\ntype R1 = MyReturn<() => number>;  // number\n\ntype Unwrap<T> = T extends Array<infer U> ? U : T;\ntype U1 = Unwrap<string[]>;        // string", "pts": ["Distributive over naked unions", "infer extracts a piece of a type", "Wrap in [T] to stop distribution"], "id": 23}, {"cat": "Utility Types", "lvl": "Advanced", "q": "What are template literal types?", "short": "Types built like template strings that produce unions of string patterns.", "why": ["They combine with unions to generate every combination and with <code>Uppercase<\/code>, <code>Lowercase<\/code>, <code>Capitalize<\/code>, <code>Uncapitalize<\/code> helpers - handy for typed event names and CSS-like strings."], "code": "type Axis = \"x\" | \"y\";\ntype Side = \"left\" | \"right\";\ntype Pos = `${Side}-${Axis}`;   // \"left-x\" | \"left-y\" | \"right-x\" | \"right-y\"\n\ntype Handler = `on${Capitalize<\"click\" | \"hover\">}`; // \"onClick\" | \"onHover\"\nconst ok: Handler = \"onClick\";\nconst no: Handler = \"onfocus\";  // ❌ not assignable", "pts": ["Cartesian product of unions", "Built-in Capitalize etc.", "Great for typed event names"], "id": 24}, {"cat": "Classes", "lvl": "Intermediate", "q": "Explain public, private, protected, readonly and #private in classes.", "short": "TypeScript modifiers are compile-time only; #private fields are enforced by JavaScript at runtime.", "why": ["<code>private<\/code> and <code>protected<\/code> are removed at compile time, so plain JS can still read them. A <code>#name<\/code> field is a true JavaScript private field. Parameter properties (<code>constructor(private x: number)<\/code>) declare and assign in one step."], "code": "class Account {\n  readonly id: number;\n  #pin: number;                         // runtime-private\n  protected balance = 0;                // subclasses allowed\n  constructor(id: number, pin: number, private owner: string) {\n    this.id = id;\n    this.#pin = pin;\n  }\n  deposit(n: number) { this.balance += n; }\n}\n\nconst a = new Account(1, 1234, \"Asha\");\na.balance;      // ❌ 'balance' is protected\na.owner;        // ❌ 'owner' is private\na.id = 2;       // ❌ read-only", "pts": ["private/protected = compile-time", "#field = real runtime privacy", "Parameter properties shorten constructors"], "id": 25}, {"cat": "Classes", "lvl": "Intermediate", "q": "Abstract class vs interface - when to use which?", "short": "An interface is a pure type contract; an abstract class can hold shared implementation and state but cannot be instantiated.", "why": ["Classes can implement many interfaces but extend only one class. Interfaces vanish at runtime, so you cannot use <code>instanceof<\/code> with them; an abstract class exists at runtime."], "code": "interface Logger { log(m: string): void }\n\nabstract class Shape {\n  abstract area(): number;              // subclasses must implement\n  describe() { return `Area: ${this.area()}`; }\n}\n\nclass Sq extends Shape {\n  constructor(private s: number) { super(); }\n  area() { return this.s ** 2; }\n}\nnew Shape();   // ❌ Cannot create an instance of an abstract class", "pts": ["Interface: no runtime, many allowed", "Abstract class: shared code, one parent", "instanceof works only with classes"], "id": 26}, {"cat": "Tooling", "lvl": "Intermediate", "q": "Which tsconfig options matter most?", "short": "strict, target, module/moduleResolution, noUncheckedIndexedAccess, isolatedModules, skipLibCheck, paths and outDir.", "why": ["<b>strict<\/b> enables a family of checks (strictNullChecks, noImplicitAny, strictFunctionTypes ...). <b>noUncheckedIndexedAccess<\/b> adds <code>| undefined<\/code> to index reads. <b>target<\/b> sets the emitted JS version; <b>module<\/b> and <b>moduleResolution<\/b> must match your bundler or Node. <b>isolatedModules<\/b> ensures each file can be transpiled alone (needed by Babel/esbuild/swc)."], "code": "// tsconfig.json\n{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"module\": \"ESNext\",\n    \"moduleResolution\": \"bundler\",\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"isolatedModules\": true,\n    \"skipLibCheck\": true,\n    \"noEmit\": true\n  },\n  \"include\": [\"src\"]\n}", "pts": ["Always enable strict", "Match module settings to the runtime/bundler", "isolatedModules for fast transpilers"], "id": 27}, {"cat": "Tooling", "lvl": "Intermediate", "q": "What are declaration files (.d.ts) and DefinitelyTyped?", "short": ".d.ts files describe the types of JavaScript code; @types/* packages supply them for libraries that ship none.", "why": ["A declaration file contains only types, no implementation. Use <code>declare module<\/code> to type an untyped package or <code>declare global<\/code> to add to global scope. Many libraries ship their own types; others use <code>npm i -D @types/lodash<\/code>."], "code": "// legacy.d.ts\ndeclare module \"legacy-lib\" {\n  export function greet(name: string): string;\n}\n\ndeclare global {\n  interface Window { appVersion: string }\n}\nexport {};", "pts": ["Types without implementation", "@types = DefinitelyTyped", "declare global augments globals"], "id": 28}, {"cat": "Tooling", "lvl": "Intermediate", "q": "What does `import type` do and why does it matter?", "short": "It imports only the type and is always erased, avoiding runtime imports and circular-dependency problems.", "why": ["With <code>isolatedModules<\/code> or <code>verbatimModuleSyntax<\/code>, re-exporting a type requires <code>export type<\/code>. Inline form: <code>import { type User, load } from './x'<\/code>."], "code": "import type { User } from \"./models\";\nimport { type Role, getRole } from \"./roles\";\n\nexport type { User };", "pts": ["Always erased", "Required for re-exporting types under isolatedModules", "Helps tree-shaking"], "id": 29}, {"cat": "Advanced", "lvl": "Advanced", "q": "Why can't TypeScript check data at runtime? How do you type API responses safely?", "short": "Types are erased, so JSON from the network is unchecked; validate at the boundary with a schema library or type guard.", "why": ["<code>await res.json()<\/code> returns <code>any<\/code> (or <code>unknown<\/code> if you declare it). Casting it with <code>as User<\/code> is a promise, not proof. Validate with a guard or a library such as Zod, and derive the static type from the schema so they never drift."], "code": "interface User { id: number; name: string }\n\nfunction isUser(v: unknown): v is User {\n  return (\n    typeof v === \"object\" && v !== null &&\n    typeof (v as Record<string, unknown>).id === \"number\" &&\n    typeof (v as Record<string, unknown>).name === \"string\"\n  );\n}\n\nasync function loadUser(): Promise<User> {\n  const res = await fetch(\"/api/user\");\n  const data: unknown = await res.json();\n  if (!isUser(data)) throw new Error(\"Bad response\");\n  return data;\n}", "pts": ["Types vanish at runtime", "Validate at the boundary", "Schema libraries infer the type for you"], "id": 30}, {"cat": "Advanced", "lvl": "Intermediate", "q": "How do you type async code and Promises?", "short": "async functions return Promise<T>; use Awaited<T> to unwrap and Promise.all keeps tuple types.", "why": ["Annotate <code>Promise&lt;T&gt;<\/code> as the return type; the <code>return<\/code> value inside is just <code>T<\/code>. <code>Promise.all<\/code> on a tuple preserves each position's type."], "code": "async function getName(): Promise<string> {\n  return \"Asha\";\n}\n\nasync function main() {\n  const [name, age] = await Promise.all([\n    getName(),\n    Promise.resolve(30),\n  ]);\n  // name: string, age: number\n  type N = Awaited<ReturnType<typeof getName>>; // string\n}", "pts": ["Return type is Promise<T>", "Promise.all keeps tuple types", "Awaited unwraps nested promises"], "id": 31}, {"cat": "Advanced", "lvl": "Advanced", "q": "Why does Object.keys(obj) return string[] and not (keyof T)[]?", "short": "Objects can have extra properties at runtime because of structural typing, so keyof T could be a lie.", "why": ["If a value of type <code>{ a: number }<\/code> is really <code>{ a: 1, b: 2 }<\/code>, <code>Object.keys<\/code> would return a key outside <code>keyof T<\/code>. When you know the object is exact, cast deliberately."], "code": "const user = { id: 1, name: \"A\" };\nfor (const k of Object.keys(user)) {\n  user[k];                                  // ❌ 'string' can't index the type\n}\nfor (const k of Object.keys(user) as (keyof typeof user)[]) {\n  console.log(user[k]);                     // OK, you vouch for exactness\n}", "pts": ["Structural typing allows extra keys", "Cast deliberately when safe", "Object.entries has the same limit"], "id": 32}, {"cat": "Advanced", "lvl": "Advanced", "q": "What are branded (nominal) types?", "short": "A trick that adds a phantom tag so structurally identical types like UserId and OrderId become incompatible.", "why": ["Since TypeScript is structural, two <code>string<\/code>-based IDs are interchangeable. Intersecting with a unique tag type prevents mixing them up; create values through one validating constructor."], "code": "type Brand<T, B extends string> = T & { readonly __brand: B };\ntype UserId = Brand<string, \"UserId\">;\ntype OrderId = Brand<string, \"OrderId\">;\n\nconst uid = (s: string) => s as UserId;\nconst oid = (s: string) => s as OrderId;\n\nfunction getUser(id: UserId) {}\ngetUser(uid(\"u1\"));\ngetUser(oid(\"o1\"));   // ❌ OrderId is not assignable to UserId\ngetUser(\"plain\");     // ❌ string is not assignable to UserId", "pts": ["Phantom tag", "Zero runtime cost", "Create through a single constructor"], "id": 33}, {"cat": "Advanced", "lvl": "Advanced", "q": "What are covariance, contravariance and strictFunctionTypes?", "short": "Return types are covariant (subtypes are OK); parameter types are contravariant (supertypes are OK) under strictFunctionTypes.", "why": ["A function accepting <code>Animal<\/code> can safely be used where one accepting <code>Dog<\/code> is expected, not the other way round. <code>strictFunctionTypes<\/code> enforces this for function-typed properties; methods declared with method syntax stay bivariant for historical reasons."], "code": "class Animal { name = \"\" }\nclass Dog extends Animal { bark() {} }\n\nlet takesDog: (d: Dog) => void = (d) => d.bark();\nlet takesAnimal: (a: Animal) => void = (a) => a.name;\n\ntakesDog = takesAnimal;   // OK: accepts more\ntakesAnimal = takesDog;   // ❌ Dog handler can't handle every Animal", "pts": ["Param types: contravariant", "Return types: covariant", "Method syntax is bivariant"], "id": 34}, {"cat": "Advanced", "lvl": "Intermediate", "q": "What is the difference between object, {} and Object?", "short": "object = any non-primitive, {} = any non-null value (including primitives), Object = avoid; use Record<string, unknown> for 'some object'.", "why": ["<code>{}<\/code> accepts strings and numbers because they have properties. <code>object<\/code> rejects primitives. <code>Object<\/code> is the wrapper interface and almost never what you want."], "code": "let a: object = { x: 1 };\na = \"str\";                    // ❌ primitives are not objects\n\nlet b: {} = \"str\";            // allowed - {} means 'not null/undefined'\nb = null;                     // ❌\n\nfunction keys(o: Record<string, unknown>) { return Object.keys(o); }", "pts": ["object = non-primitive", "{} = non-nullish", "Avoid Object"], "id": 35}, {"cat": "Advanced", "lvl": "Intermediate", "q": "How should you type errors in catch clauses?", "short": "Caught values are unknown (with useUnknownInCatchVariables, part of strict); narrow with instanceof before using them.", "why": ["Anything can be thrown in JavaScript, not only Error objects, so the compiler no longer assumes <code>any<\/code>."], "code": "try {\n  JSON.parse(\"{\");\n} catch (err) {\n  err.message;                               // ❌ 'err' is of type 'unknown'\n  if (err instanceof Error) {\n    console.log(err.message);                // OK\n  } else {\n    console.log(String(err));\n  }\n}", "pts": ["catch variable is unknown in strict mode", "Narrow with instanceof Error", "Anything can be thrown"], "id": 36}, {"cat": "Advanced", "lvl": "Intermediate", "q": "How do you type React props and state (function components)?", "short": "Define an interface for props, use generics for useState when inference isn't enough, and React.ReactNode for children.", "why": ["Avoid <code>React.FC<\/code> in new code (it adds little). Type event handlers with <code>React.ChangeEvent&lt;HTMLInputElement&gt;<\/code>. Use <code>useState&lt;User | null&gt;(null)<\/code> when the initial value is narrower than the state."], "code": "// nocheck\nimport { useState } from \"react\";\n\ninterface ButtonProps {\n  label: string;\n  onClick: () => void;\n  children?: React.ReactNode;\n}\n\nexport function Button({ label, onClick, children }: ButtonProps) {\n  const [user, setUser] = useState<{ name: string } | null>(null);\n  return <button onClick={onClick}>{label}{children}<\/button>;\n}", "pts": ["Interface for props", "Generic useState for unions", "Typed event handlers"], "id": 37}];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(src){
  const t=[];let h=esc(src);
  h=h.replace(/(\/\/[^\n]*)/g,(m)=>{t.push(m.includes("❌")?'<span class="e">'+m+'</span>':'<span class="c">'+m+'</span>');return "\u0001"+(t.length-1)+"\u0002"});
  h=h.replace(/(`[^`]*`|"[^"\n]*"|'[^'\n]*')/g,m=>{t.push('<span class="s">'+m+'</span>');return "\u0001"+(t.length-1)+"\u0002"});
  h=h.replace(/\b(const|let|var|function|return|if|else|interface|type|class|extends|implements|new|import|export|from|as|keyof|typeof|infer|in|is|asserts|readonly|abstract|declare|module|global|enum|switch|case|default|async|await|try|catch|throw|never|void|unknown|any|string|number|boolean|null|undefined|true|false|private|protected|public|satisfies|super|this|for|of)\b/g,'<span class="k">$1</span>');
  h=h.replace(/\b(\d+)\b(?!\u0002)/g,'<span class="n">$1</span>');
  return h.replace(/\u0001(\d+)\u0002/g,(_,i)=>t[+i]);
}
let st={};try{st=JSON.parse(localStorage.getItem("ts-iq")||"{}")}catch(e){}

try{const th=localStorage.getItem("ts-iq-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
$("#theme").onclick=()=>{const r=document.documentElement,n=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("ts-iq-theme",n)}catch(e){}};
let cat="All",lvl="All";
const cats=["All",...new Set(DATA.map(d=>d.cat))],lvls=["All","Beginner","Intermediate","Advanced"];
function chips(el,arr,get,set){el.innerHTML="";arr.forEach(v=>{const b=document.createElement("button");b.className="chip"+(get()===v?" on":"");b.textContent=v;b.onclick=()=>{set(v);render();chips(el,arr,get,set)};el.appendChild(b)})}
function vis(){const s=$("#q").value.toLowerCase();return DATA.filter(d=>(cat==="All"||d.cat===cat)&&(lvl==="All"||d.lvl===lvl)&&(!s||(d.q+d.short+d.why.join(" ")+d.code).toLowerCase().includes(s)))}
function card(d){
  const el=document.createElement("div");el.className="card"+(st[d.id]?" known":"");
  el.innerHTML=`<div class="qh"><div class="num">${d.id}</div><div class="qt">${esc(d.q)}<div class="tags"><span class="tag">${d.cat}</span><span class="tag ${d.lvl}">${d.lvl}</span>${st[d.id]?'<span class="tag" style="background:#d8f3e2;color:#12522e">Known</span>':''}</div></div></div>
  <div class="body"><div class="short">${esc(d.short)}</div>${d.why.map(p=>"<p>"+p+"</p>").join("")}
  <pre><button class="cp">Copy</button><code>${hl(d.code.replace(/^\/\/ nocheck\n/,""))}</code></pre>
  <b>Key points</b><ul class="pts">${d.pts.map(p=>"<li>"+esc(p)+"</li>").join("")}</ul>
  <div class="tryq">Lines marked in red with a cross are intentional compiler errors.</div>
  <div class="act"><button class="kn ${st[d.id]?"on":""}">${st[d.id]?"Marked as known":"I know this"}</button></div></div>`;
  el.querySelector(".qh").onclick=()=>el.classList.toggle("open");
  el.querySelector(".cp").onclick=e=>{const b=e.target;const txt=d.code.replace(/^\/\/ nocheck\n/,"").replace(/ *\/\/ ❌.*$/mg,"");(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{b.textContent="Copied"},()=>{b.textContent="Press Ctrl+C"});setTimeout(()=>b.textContent="Copy",1500)};
  el.querySelector(".kn").onclick=()=>{st[d.id]=!st[d.id];save();render(true)};
  return el;
}
function render(keep){
  const l=vis(),box=$("#list");const open=new Set([...box.querySelectorAll(".card.open .num")].map(n=>n.textContent));
  box.innerHTML="";if(!l.length)box.innerHTML='<div class="empty">No questions match your filters.</div>';
  l.forEach(d=>{const c=card(d);if(keep&&open.has(String(d.id)))c.classList.add("open");box.appendChild(c)});
  const k=DATA.filter(d=>st[d.id]).length;$("#stats").textContent=`${l.length} shown - ${k}/${DATA.length} known`;$("#pbar").style.width=(100*k/DATA.length)+"%";
}
chips($("#cats"),cats,()=>cat,v=>cat=v);chips($("#lvls"),lvls,()=>lvl,v=>lvl=v);

let qs=[],qi=0,score=0,done=false;
function startQuiz(){qs=[...DATA].sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;showQ()}
function showQ(){
  done=false;const d=qs[qi];$("#qinfo").textContent=`Question ${qi+1} of ${qs.length} - Score ${score}`;$("#qq").textContent=d.q;
  const correct=d.short;const wrong=DATA.filter(x=>x.id!==d.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.short);
  const opts=[correct,...wrong].sort(()=>Math.random()-.5);const box=$("#opts");box.innerHTML="";$("#qexp").style.display="none";$("#next").style.display="none";
  opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>{if(done)return;done=true;
    if(o===correct){b.classList.add("good");score++}else{b.classList.add("wrong");[...box.children].forEach(x=>{if(x.textContent===correct)x.classList.add("good")})}
    const e=$("#qexp");e.style.display="block";e.innerHTML="<div class='short'>Why</div>"+d.why.map(p=>"<p>"+p+"</p>").join("");
    $("#qinfo").textContent=`Question ${qi+1} of ${qs.length} - Score ${score}`;const n=$("#next");n.style.display="inline-block";n.textContent=qi+1<qs.length?"Next question":"See result"};box.appendChild(b)});
}
$("#next").onclick=()=>{if(qi+1<qs.length){qi++;showQ()}else{$("#qq").textContent=`Finished: ${score} / ${qs.length}`;$("#opts").innerHTML="";$("#qexp").style.display="none";$("#qinfo").textContent="Quiz complete";const n=$("#next");n.textContent="Try again";n.onclick=()=>{n.onclick=nextH;startQuiz()}}};
const nextH=$("#next").onclick;
function mode(m){$("#list").style.display=m==="s"?"block":"none";$("#quiz").style.display=m==="q"?"block":"none";
 $("#mStudy").style.cssText=m==="s"?"":"background:transparent;color:var(--ac)";$("#mQuiz").style.cssText=m==="q"?"":"background:transparent;color:var(--ac)";if(m==="q")startQuiz()}
$("#mStudy").onclick=()=>mode("s");$("#mQuiz").onclick=()=>mode("q");
render();
</script></body></html>
